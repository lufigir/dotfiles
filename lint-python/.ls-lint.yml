# Estructura para un proyecto Python: copiar a la raíz. Mismo criterio que el preset de
# TypeScript (`lint/.ls-lint.yml`): tope de archivos sueltos por capa y por módulo.
#
# snake_case y no kebab-case: un guion no se puede importar. Los topes son los del preset
# de TypeScript más uno, porque cada paquete lleva su `__init__.py`.
# ADAPTAR: `src/app` al paquete raíz del proyecto.
ls:
  # Raíz de cada capa, con su nombre literal: ls-lint resuelve una ruta literal antes
  # que un comodín, pero entre dos comodines que tocan la misma carpeta (`src/app/*` y
  # `src/app/*/**`) elige al azar en cada corrida. ADAPTAR: los nombres de capa.
  src/app/api:
    .*: snake_case | exists:0-9
  src/app/data:
    .*: snake_case | exists:0-9
  src/app/capabilities:
    .*: snake_case | exists:0-9
  src/app/domain:
    .*: snake_case | exists:0-9
  src/app/**:
    .*: snake_case | exists:0-16

ignore:
  - .git
  - .venv
  - __pycache__
  - .ruff_cache
  - .pytest_cache
