# Hooks locales. Copiar a la raíz y correr `uv run pre-commit install --hook-type pre-commit --hook-type pre-push`.
#
# pre-commit formatea lo que está en stage; pre-push corre lint, estructura y fronteras
# en segundos. Un hook y no una línea en AGENTS.md, porque los agentes se saltan pasos.
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
        stages: [pre-commit]
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
        stages: [pre-push]
      - id: ls-lint
        name: ls-lint
        entry: npx -y @ls-lint/ls-lint@2.3.2
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: lint-imports
        name: import-linter
        entry: uv run lint-imports
        language: system
        pass_filenames: false
        stages: [pre-push]
